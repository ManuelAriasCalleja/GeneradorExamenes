# Paquete para Windows (ver README, «Compilar en GitHub»). Solo se lanza a mano (Actions → Paquete para Windows →
# Run workflow) o al subir una etiqueta de versión (v1.1…), nunca con cada push. Compila con el Qt y el MinGW del
# instalador oficial de Qt, prepara el paquete (objetivo «paquete» de CMake), lo deja para descargar y pasa las
# pruebas. Con una etiqueta, además, publica una versión (release) con el zip.
name: Paquete para Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # solo para publicar la versión al subir una etiqueta

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Qt 6.8 (LTS) para MinGW, con Qt PDF, y el MinGW y el Ninja con los que se distribuye. En caché: solo la
      # primera ejecución los descarga.
      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtpdf
          tools: 'tools_mingw1310 tools_ninja'
          cache: true

      # Que se usen el MinGW y el Ninja de Qt, y no otros que tenga el equipo de GitHub.
      - name: Compilador en el PATH
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:IQTA_TOOLS\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configurar
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Compilar
        run: cmake --build build --parallel

      - name: Preparar el paquete
        run: cmake --build build --target paquete

      - name: Guardar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: GeneradorExamenesFI-windows
          path: build/GeneradorExamenesFI-*-windows.zip
          retention-days: 30
          if-no-files-found: error

      # Después del paquete, para que se pueda descargar aunque falle alguna prueba (la ejecución sale en rojo).
      - name: Pruebas
        id: pruebas
        run: ctest --test-dir build --output-on-failure

      # En Windows, ctest no enseña lo que escriben las pruebas que fallan: se vuelven a ejecutar con la salida a un
      # fichero, que se muestra, y su código de salida (el número de comprobaciones fallidas; 0xC0000135: falta una DLL).
      - name: Detalle de las pruebas que fallan
        if: failure() && steps.pruebas.outcome == 'failure'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts   # como en CMakeLists.txt
        run: |
          foreach ($linea in Get-Content build\Testing\Temporary\LastTestsFailed.log) {
            $nombre = $linea.Split(':')[1]
            Write-Host "=== prueba_$nombre"
            $salida = Join-Path $env:RUNNER_TEMP "prueba_$nombre.txt"
            & "build\prueba_$nombre.exe" -o "$salida,txt" 2>&1 | Out-Host
            Write-Host ("Código de salida: 0x{0:X8}" -f $LASTEXITCODE)
            if (Test-Path $salida) { Get-Content $salida -Encoding utf8 | Out-Host }
          }

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/GeneradorExamenesFI-*-windows.zip
