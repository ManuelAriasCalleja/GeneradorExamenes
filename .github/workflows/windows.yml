# Paquetes para Windows y macOS (ver README). Solo se lanza a mano (Actions → Paquetes para Windows y macOS → Run
# workflow) o al subir una etiqueta de versión (v1.1…), nunca con cada push. Compila con el Qt del instalador oficial
# (en Windows, también su MinGW), prepara cada paquete (objetivo «paquete» de CMake), lo deja para descargar y pasa las
# pruebas. Con una etiqueta, además, publica una versión (release) con el zip de Windows. El de macOS va sin la firma de
# Apple y no se publica hasta que se haya probado en un Mac: solo queda para descargar en la ejecución.
name: Paquetes para Windows y macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # solo para publicar la versión al subir una etiqueta

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Qt 6.8 (LTS) para MinGW, con Qt PDF, y el MinGW y el Ninja con los que se distribuye. En caché: solo la
      # primera ejecución los descarga.
      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtpdf
          tools: 'tools_mingw1310 tools_ninja'
          cache: true

      # Que se usen el MinGW y el Ninja de Qt, y no otros que tenga el equipo de GitHub.
      - name: Compilador en el PATH
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:IQTA_TOOLS\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configurar
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Compilar
        run: cmake --build build --parallel

      - name: Preparar el paquete
        run: cmake --build build --target paquete

      - name: Guardar el paquete
        uses: actions/upload-artifact@v7
        with:
          name: GeneradorExamenes-windows
          path: build/GeneradorExamenes-*-windows.zip
          retention-days: 30
          if-no-files-found: error

      # Después del paquete, para que se pueda descargar aunque falle alguna prueba (la ejecución sale en rojo).
      - name: Pruebas
        id: pruebas
        run: ctest --test-dir build --output-on-failure

      # En Windows, ctest no enseña lo que escriben las pruebas que fallan: se vuelven a ejecutar con la salida a un
      # fichero, que se muestra, y su código de salida (el número de comprobaciones fallidas; 0xC0000135: falta una DLL).
      - name: Detalle de las pruebas que fallan
        if: failure() && steps.pruebas.outcome == 'failure'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts   # como en CMakeLists.txt
        run: |
          foreach ($linea in Get-Content build\Testing\Temporary\LastTestsFailed.log) {
            $nombre = $linea.Split(':')[1]
            Write-Host "=== prueba_$nombre"
            $salida = Join-Path $env:RUNNER_TEMP "prueba_$nombre.txt"
            & "build\prueba_$nombre.exe" -o "$salida,txt" 2>&1 | Out-Host
            Write-Host ("Código de salida: 0x{0:X8}" -f $LASTEXITCODE)
            if (Test-Path $salida) { Get-Content $salida -Encoding utf8 | Out-Host }
          }

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/GeneradorExamenes-*-windows.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Qt 6.11 y no el 6.8 de Windows, que enlaza con el framework AGL, ya ausente del SDK de macos-latest. Sirve para
      # procesadores Apple e Intel, con macOS 13 o posterior.
      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtpdf
          cache: true

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Compilar
        run: cmake --build build --parallel

      - name: Preparar el paquete
        run: cmake --build build --target paquete

      - name: Guardar el paquete
        uses: actions/upload-artifact@v7
        with:
          name: GeneradorExamenes-macos
          path: build/GeneradorExamenes-*-macos.dmg
          retention-days: 30
          if-no-files-found: error

      # La aplicación del paquete, sola: que tenga las dos arquitecturas, que no dependa del Qt de la máquina y que
      # arranque y cree un banco (para lo que necesita el controlador de SQLite). Sin pantalla: no prueba los menús.
      - name: Comprobar el paquete
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app=build/paquete/GeneradorExamenes.app
          programa=$app/Contents/MacOS/GeneradorExamenes
          codesign --verify --deep --strict "$app"
          lipo "$programa" -verify_arch arm64 x86_64
          if otool -L "$programa" | grep -F "$QT_ROOT_DIR"; then
            echo "El programa depende del Qt de la máquina" >&2
            exit 1
          fi
          "$programa" --comprobar recursos/ejemplo_banco.json
          banco="$RUNNER_TEMP/prueba.db"
          "$programa" "$banco" &
          pid=$!
          for _ in $(seq 1 60); do
            [ -s "$banco" ] && break
            sleep 0.5
          done
          kill -0 "$pid"
          kill "$pid"
          test -s "$banco"

      - name: Pruebas
        run: ctest --test-dir build --output-on-failure
