<?xml version="1.0" encoding="UTF-8"?>
<!-- Icono del Generador de exámenes: dos hojas de examen tipo test (modelos A y B) con las respuestas marcadas.
     Fuente de los PNG de recursos/icono/ (ver recursos/generar_iconos.sh). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3478c6"/>
      <stop offset="1" stop-color="#1c4f8e"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#fondo)"/>

  <!-- Hoja de detrás (otro modelo) -->
  <g transform="rotate(8 128 128)">
    <rect x="72" y="34" width="132" height="176" rx="10" fill="#a9c6e8"/>
  </g>

  <!-- Hoja de delante, con la esquina doblada -->
  <path d="M60 46 h96 l30 30 v138 a10 10 0 0 1 -10 10 h-116 a10 10 0 0 1 -10 -10 v-158 a10 10 0 0 1 10 -10 z"
        fill="#ffffff"/>
  <path d="M156 46 v22 a8 8 0 0 0 8 8 h22 z" fill="#d5e2f2"/>

  <!-- Título -->
  <rect x="66" y="60" width="66" height="10" rx="5" fill="#1c4f8e"/>

  <!-- Tres preguntas: enunciado y opciones a–d, con la correcta marcada -->
  <g fill="#9aa9bd">
    <rect x="66" y="88" width="100" height="7" rx="3.5"/>
    <rect x="66" y="132" width="88" height="7" rx="3.5"/>
    <rect x="66" y="176" width="100" height="7" rx="3.5"/>
  </g>
  <g fill="none" stroke="#5d6f87" stroke-width="3.5">
    <circle cx="74" cy="111" r="7"/>                                <circle cx="126" cy="111" r="7"/> <circle cx="152" cy="111" r="7"/>
    <circle cx="74" cy="155" r="7"/> <circle cx="100" cy="155" r="7"/> <circle cx="126" cy="155" r="7"/>
                                     <circle cx="100" cy="199" r="7"/> <circle cx="126" cy="199" r="7"/> <circle cx="152" cy="199" r="7"/>
  </g>
  <g fill="#2fa35f">
    <circle cx="100" cy="111" r="9"/>
    <circle cx="152" cy="155" r="9"/>
    <circle cx="74" cy="199" r="9"/>
  </g>
</svg>
